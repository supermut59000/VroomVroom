services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vroomvroom-backend
    ports:
      - "8055:8000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./.env.docker
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vroomvroom-network

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: vroomvroom-frontend
  #   ports:
  #     - "3056:3000"
  #   depends_on:
  #     - backend
  #   restart: unless-stopped
  #   networks:
  #     - vroomvroom-network

  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: vroomvroom-frontend-react
    ports:
      - "3055:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vroomvroom-network

networks:
  vroomvroom-network:
    driver: bridge
